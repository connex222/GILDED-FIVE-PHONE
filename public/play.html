<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071b21">
<link rel="icon" type="image/svg+xml" href="assets/gilded-five-mark.svg">
<title>Gilded Five - Phone</title>
<style>
:root{
  --felt:#0f5132; --felt-hi:#1a7a4c; --felt-deep:#08331f; --sticky:#0a3a24;
  --gold:#d4af37; --gold-hi:#ffd86b; --gold-lo:#8c6a12; --gold-pale:#fff3c4;
  --cream:#fbf5e6; --cream-dim:rgba(251,245,230,.76); --cream-faint:rgba(251,245,230,.45);
  --ink:#1b1408; --line:rgba(212,175,55,.4); --line-soft:rgba(212,175,55,.16); --warn:#ff9d94;
  --die-face:#fffaf0; --die-edge:#e3d6b8; --pip:#141414; --pip-one:#b3261e;
  --d:clamp(46px,calc((100vw - 32px - 40px)/5),86px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--felt-deep);color:var(--cream);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
[hidden]{display:none!important}
.foil{font-family:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif;font-weight:700;
  background:linear-gradient(180deg,#fff7d6 0%,#ffd86b 30%,#d4af37 58%,#8c6a12 82%,#f0d27a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:radial-gradient(ellipse at 50% 20%,var(--felt-hi) 0%,var(--felt) 50%,var(--felt-deep) 100%)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{padding:16px}
.chip{--c:#c62828;display:inline-grid;place-items:center;flex:none;width:2em;height:2em;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 50%,rgba(255,255,255,.85) 51% 54%,var(--c) 55%);
  border:.2em dashed rgba(255,255,255,.9);box-shadow:0 0 0 .08em var(--c),0 2px 4px rgba(0,0,0,.5);
  color:#fff;font-weight:800;font-size:1em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.c0{--c:#ae3830}.c1{--c:#ad832b}.c2{--c:#174b33}.c3{--c:#966547}.c4{--c:#7b412d}.c5{--c:#23795b}.c6{--c:#9f514f}.c7{--c:#6b642b}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:999px;border:2px solid var(--gold-pale);
  font-family:Didot,"Bodoni 72","Bodoni MT",Georgia,serif;font-weight:700;font-size:1.25em;color:var(--ink);
  background:linear-gradient(180deg,#fff2c0,#ffd86b 28%,#d4af37 64%,#9c7a18);box-shadow:0 4px 0 #6e5310,0 8px 18px rgba(0,0,0,.4)}
.btn:active:not(:disabled){translate:0 3px;box-shadow:0 1px 0 #6e5310}
.btn:disabled{filter:grayscale(.75) brightness(.62);cursor:not-allowed}
.btn.alt{background:rgba(0,0,0,.3);color:var(--gold-hi);border-color:var(--line);box-shadow:none;font-size:1.05em;min-height:48px}
.muted{color:var(--cream-dim)}
.err{color:var(--warn);font-weight:600;min-height:1.4em;text-align:center}

/* join + wait */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;width:100%;margin:0 auto;padding:20px 20px}
.title{font-size:clamp(38px,12vw,60px);letter-spacing:.1em;text-align:center;line-height:1.05}
.tag{text-align:center;color:var(--gold);font-style:italic;font-family:Georgia,serif}
.field{display:grid;gap:6px}
.field label{color:var(--gold);font-weight:700;font-size:.9em}
.field input{min-height:56px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);font-size:20px;
  user-select:text;-webkit-user-select:text}
.field input.code{text-align:center;letter-spacing:.35em;font-size:30px;text-transform:uppercase;font-weight:800;padding-left:.35em}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:99px;background:rgba(0,0,0,.3);border:1.5px solid var(--line-soft);font-size:.95em}
.pill .chip{font-size:.75em}
.me .pill{border-color:var(--gold-hi)}
.bigchip{font-size:44px;margin:0 auto}
.conn{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:50;text-align:center;padding:6px 10px;background:#7a1f16;color:#fff;font-weight:700;font-size:.9em}

/* game */
.gbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1))}
.gbar .chip{font-size:.9em}
.gbar .who{min-width:0;flex:1}
.gbar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.gbar .sub{color:var(--cream-dim);font-size:.82em}
.gbar .scores{min-height:40px;padding:0 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1.5px solid var(--line);font-weight:700;color:var(--gold-hi)}
.turnbar{margin:10px 12px 0;padding:8px 12px;border-radius:14px;text-align:center;font-weight:800;letter-spacing:.04em;background:rgba(0,0,0,.28);border:1.5px solid var(--line-soft);color:var(--cream-dim)}
.turnbar.mine{background:linear-gradient(180deg,#fff2c0,#ffd86b 40%,#d4af37);color:var(--ink);border-color:var(--gold-pale);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px 2px rgba(255,216,107,.6)}}
.tray{display:flex;justify-content:center;gap:10px;padding:calc(var(--d)*.3) 16px calc(var(--d)*.15)}
.die{position:relative;width:var(--d);height:var(--d);padding:0;border:0;border-radius:20%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:calc(var(--d)*.12);background:radial-gradient(circle at 30% 24%,#fff 0%,var(--die-face) 52%,var(--die-edge) 100%);
  box-shadow:inset 0 0 calc(var(--d)*.07) rgba(0,0,0,.25),0 5px 8px rgba(0,0,0,.45);transition:translate .15s,opacity .15s}
.die:disabled{cursor:default;color:inherit}
.die .pip{width:78%;height:78%;margin:auto;border-radius:50%;background:radial-gradient(circle at 36% 30%,#5a5a5a,var(--pip) 62%);box-shadow:inset 0 2px 2px rgba(0,0,0,.7)}
.die.f1 .pip{width:96%;height:96%;background:radial-gradient(circle at 36% 30%,#e8645a,var(--pip-one) 64%)}
.die.idle{opacity:.42}
.die.held{translate:0 -10px;box-shadow:0 0 0 3px var(--gold-hi),0 0 18px 4px rgba(255,216,107,.55),0 12px 10px rgba(0,0,0,.4)}
.die.held::after{content:"HELD";position:absolute;left:50%;bottom:-1.5em;translate:-50% 0;padding:1px 7px;border-radius:99px;background:var(--gold-hi);color:var(--ink);font-size:10px;font-weight:800;letter-spacing:.08em}
.die.suggest{outline:3px dashed var(--gold-hi);outline-offset:4px}
.die.drop{outline:3px dashed var(--warn);outline-offset:4px}
.die.rolling{animation:jig .12s linear infinite}
@keyframes jig{0%{rotate:-8deg;translate:-2px 0}50%{rotate:8deg;translate:2px -4px}100%{rotate:-8deg;translate:-2px 0}}
.msg{min-height:2.7em;padding:14px 16px 4px;text-align:center;color:var(--cream-dim);font-size:.98em;line-height:1.3}
.msg.alert{color:var(--gold-hi);font-weight:700}
.actions{display:flex;gap:10px;padding:0 16px 8px}
.hintb{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.32);border:2px solid var(--gold);color:var(--gold-hi);font-weight:700;font-size:.85em}
.hintb:disabled{opacity:.35}
.rollb{flex:1;min-height:64px;font-size:1.5em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 16px 8px}
.tabs button{min-height:44px;border-radius:999px;font-weight:700;background:rgba(0,0,0,.3);border:2px solid var(--line);color:var(--cream)}
.tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#fff2c0,#ffd86b 30%,#d4af37);color:var(--ink);border-color:var(--gold-pale)}
.panel{flex:1;min-height:0;overflow:auto;margin:0 12px 12px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.24);padding:8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.empty{padding:22px 10px;text-align:center;color:var(--cream-dim)}
.orow{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.orow .ol{flex:1;min-width:0;font-weight:700;line-height:1.15}
.orow .ol small{display:block;color:var(--gold);font-weight:500;font-size:.78em}
.opt{min-height:52px;min-width:78px;padding:0 12px;border-radius:14px;border:2px solid var(--gold);background:rgba(255,216,107,.16);color:var(--gold-hi);font-weight:800;font-size:1.25em;position:relative}
.opt small{display:block;font-size:.5em;font-weight:700;color:var(--cream-dim);line-height:1}
.opt.zero{color:var(--cream-dim);border-color:var(--line);background:rgba(0,0,0,.25);font-weight:600}
.opt.confirm{background:rgba(224,87,79,.3);border-color:var(--warn);color:var(--warn)}
.opt.best{box-shadow:0 0 0 3px var(--gold-hi),0 0 14px rgba(255,216,107,.55)}
.opt .bn{position:absolute;top:-9px;right:-4px;background:var(--gold-hi);color:var(--ink);font-size:10px;border-radius:99px;padding:0 6px;font-weight:800}
.sect{margin:10px 2px 6px;color:var(--gold);font-weight:700;font-size:.85em;letter-spacing:.05em}
.orow.single .opt{flex:none;width:110px}
table.card{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.card td,.card th{padding:7px 6px;border-bottom:1px solid var(--line-soft);text-align:center}
.card th[scope=row]{text-align:left;font-weight:500}
.card thead th{color:var(--gold);font-size:.85em}
.card td.v{font-weight:700}
.card td.open{color:var(--cream-faint)}
.card tr.sub td,.card tr.sub th{color:var(--gold);font-weight:700;background:rgba(0,0,0,.2)}
.card tr.tot td,.card tr.tot th{color:var(--gold-hi);font-weight:800;font-size:1.15em;border-top:2px solid var(--line)}
.undo{margin:0 12px 8px;min-height:44px;width:calc(100% - 24px)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(2,18,10,.86);display:grid;place-items:center;padding:16px}
.sheet .box{width:100%;max-width:480px;max-height:100%;overflow:auto;border-radius:22px;padding:18px;border:3px double var(--gold);
  background:radial-gradient(ellipse at 50% 0%,var(--felt-hi),var(--felt) 55%,var(--felt-deep))}
.sheet h2{margin:0 0 10px;text-align:center;color:var(--gold-hi);font-family:Didot,Georgia,serif}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line-soft)}
.rank.first{border-color:var(--gold-hi);background:rgba(255,216,107,.14)}
.rank.act{border-color:var(--gold-hi)}
.rank .pos{width:1.6em;text-align:center;color:var(--gold-hi);font-weight:800}
.rank .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .tt{font-weight:800;font-size:1.25em;color:var(--gold-hi)}
.champ{text-align:center;padding:12px;margin-bottom:12px;border-radius:18px;background:linear-gradient(180deg,rgba(255,216,107,.25),rgba(255,216,107,.05));border:2px solid var(--gold)}
.champ .foil{display:block;font-size:clamp(28px,9vw,44px);line-height:1.1;word-break:break-word}
/* teams, shake to roll */
.turnbar.team{background:rgba(255,216,107,.16);color:var(--gold-hi);border-color:var(--gold)}
.tpair{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;border:1px dashed var(--line);width:100%}
.tpair .tl{color:var(--gold);font-weight:700;font-size:.85em;flex-basis:100%;text-align:center}
.shakeb{padding:0 10px;font-size:.85em}
.shakeb[aria-pressed="true"]{background:rgba(255,216,107,.22);border-color:var(--gold-hi)}
/* side bets and power moves */
.betbox{margin:6px 12px 8px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.32);border:2px dashed var(--gold);text-align:center}
.betbox .bq{font-weight:700;line-height:1.25;margin:2px 0 8px}
.betbox .bk{color:var(--gold);font-size:.82em;font-weight:700}
.betbox .row{display:flex;gap:8px;justify-content:center;margin-top:6px}
.betbox .amt{flex:1;max-width:76px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream);font-weight:800;font-size:1.1em}
.betbox .amt[aria-pressed="true"]{border-color:var(--gold-hi);background:rgba(255,216,107,.22);color:var(--gold-hi)}
.betbox .amt:disabled{opacity:.35}
.betbox .side{flex:1;min-height:52px;border-radius:14px;font-weight:800;font-size:1.15em;border:2px solid var(--gold-pale);color:var(--ink);
  background:linear-gradient(180deg,#fff2c0,#ffd86b 30%,#d4af37)}
.betbox .side.no{background:rgba(0,0,0,.3);color:var(--gold-hi);border-color:var(--gold)}
.betbox .side small{display:block;font-size:.62em;font-weight:700}
.betbox .side:disabled{opacity:.4}
.betbox .note{color:var(--cream-dim);font-size:.88em;margin-top:6px}
.betbox .placed{color:var(--gold-hi);font-weight:800}
.pots{color:var(--gold-hi);font-weight:700;font-size:.9em}
.powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:0 16px 8px}
.powers .pw{flex:1;min-width:76px;min-height:48px;border-radius:12px;border:2px solid var(--gold);background:rgba(255,216,107,.12);color:var(--gold-hi);font-weight:800;line-height:1.1}
.powers .pw small{display:block;font-size:.7em;color:var(--cream-dim);font-weight:600}
.powers .pw:disabled{opacity:.35}
.powers .pw.x{flex:none;border-color:var(--line);background:rgba(0,0,0,.3);color:var(--cream-dim);padding:0 14px}
.powers .ask{flex-basis:100%;text-align:center;font-weight:700;color:var(--cream)}
.powers .tgt .chip{font-size:.6em;margin-right:4px}
.die.pick{outline:3px dashed #9fe3a8;outline-offset:4px}
.hiroll{text-align:center;padding:8px;margin:0 0 10px;border-radius:14px;border:2px dashed var(--gold);background:rgba(0,0,0,.25)}
.hiroll b{color:var(--gold-hi)}
/* house rule strip, lucky roll, awards */
.house{margin:8px 12px 0;padding:6px 12px;border-radius:12px;background:#f6ecd2;color:var(--ink);border:2px solid var(--gold);text-align:center;font-size:.9em;line-height:1.25}
.house b{color:#7d1a12;font-family:Didot,"Bodoni 72",Georgia,serif;font-size:1.1em;margin-right:.3em}
.house.new{animation:houseIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes houseIn{0%{opacity:0;scale:.8;rotate:-4deg}60%{scale:1.05;rotate:1deg}100%{opacity:1;scale:1;rotate:0deg}}
.rollb.lucky{background:linear-gradient(180deg,#e6ffe2,#9fe3a8 28%,#3fa35f 64%,#22683b);border-color:#e6ffe2;box-shadow:0 4px 0 #174a29,0 8px 18px rgba(0,0,0,.4)}
.opt.glow{box-shadow:0 0 0 3px var(--gold-hi),0 0 16px rgba(255,216,107,.6);animation:optGlow 1.3s ease-in-out infinite}
@keyframes optGlow{50%{box-shadow:0 0 0 3px var(--gold-hi),0 0 4px rgba(255,216,107,.2)}}
.card tr.xp td,.card tr.xp th{color:var(--gold-hi)}
.awards{display:grid;gap:6px;margin:12px 0}
.award{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line-soft)}
.award.mine{border-color:var(--gold-hi);background:rgba(255,216,107,.14)}
.award .ic{font-size:1.7em;flex:none}
.award .t{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:700;color:var(--gold-hi)}
.award .w{color:var(--cream-dim);font-size:.88em}
.award .w b{color:var(--cream)}
@media (max-height:640px){.msg{min-height:1.6em;padding-top:8px}.tray{padding-top:8px}.turnbar{padding:5px}}
@media (prefers-reduced-motion: reduce){.die.rolling,.turnbar.mine,.house.new,.opt.glow{animation:none}}


/* Prior refinements consolidated into the single HTML source. */
/* Gilded Five phone-controller visual refresh · matches the host */
:root{--felt:#103f3b;--felt-hi:#1d6958;--felt-deep:#06191e;--sticky:#0e3230;--gold:#e5b058;--gold-hi:#ffdf99;--gold-lo:#8d5a2a;--gold-pale:#fff0c6;--cream:#f5f8f3;--cream-dim:#d2ded9;--cream-faint:#92aaa6;--ink:#202014;--line:rgba(238,191,110,.44);--line-soft:rgba(238,191,110,.18)}
html,body{background:#06191e;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{background:radial-gradient(ellipse at 50% 0,#246b5b7a,transparent 60%),radial-gradient(ellipse at 100% 95%,#0f45477a,transparent 65%),linear-gradient(145deg,#0d3132,#071b22 75%)}
#scrJoin .center{max-width:475px;justify-content:center;gap:12px;overflow-y:auto;padding-block:20px}
.phone-logo{display:block;max-width:min(91%,350px);height:auto;margin:0 auto -7px;filter:drop-shadow(0 12px 22px #0008)}
#scrJoin .tag{font-family:Georgia,serif;font-style:italic;color:#f7dfb1;letter-spacing:.05em}
.join-kicker{font-size:11px;letter-spacing:.22em;color:#eebd73;text-align:center;text-transform:uppercase;font-weight:800}
#joinForm{flex:0 0 auto;width:100%;background:#071f26cc;border:1px solid #eabd764d;border-radius:22px;padding:19px!important;margin-top:8px;box-shadow:0 18px 44px #0006}
.field{gap:8px}.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#f2c782}
.field input{background:#092b32;border:1px solid #d9b97880;color:#fff;border-radius:13px;min-height:58px}
.field input:focus{border-color:#ffe0a0}
.field input.code{font-weight:900;letter-spacing:.36em;background:#173c3d}
.field input::placeholder{color:#97b5b0}
.btn{border-radius:15px;font-family:Inter,system-ui,sans-serif;text-transform:uppercase;font-weight:900;letter-spacing:.04em;background:linear-gradient(170deg,#fff4d0,#ffda81 30%,#e3a33b 78%,#b8712d);border:1px solid #fff0be;box-shadow:0 4px 0 #764919,0 10px 22px #0008;color:#211c12}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn.alt{border-radius:14px;border:1px solid #dcb77674;background:#103235;color:#ffe09b;box-shadow:none}
.gbar{padding:10px 13px;gap:8px;min-height:65px;background:#061c23ec;border-bottom:1px solid #d7ab6373;box-shadow:0 6px 26px #0004}
.gbar .nm{font-weight:850;font-size:16px}.gbar .sub{color:#c2d5ce}.gbar .scores{border:1px solid #e4bd7970;background:#153d3c;color:#ffdf9d;border-radius:12px;min-height:44px;padding:0 11px}
.turnbar{border-radius:12px;border:1px solid #d6af6b77;background:#10393d;font-size:13px;padding:11px 8px;margin-top:9px}
.turnbar.mine{background:linear-gradient(160deg,#fff1c6,#e4ae56);color:#142720}
.tray{position:relative;border-radius:20px;margin:9px 12px 3px;padding:calc(var(--d)*.22) 3px calc(var(--d)*.18);gap:clamp(5px,2vw,10px);background:radial-gradient(ellipse at center,#2d67594d,transparent 80%)}
.msg{padding:9px 14px 6px;min-height:2.3em;color:#dce5de}
.actions{gap:9px;padding:0 13px 10px}
.hintb{height:61px;width:66px;border-radius:14px;border:1px solid #eec98496;background:#163b3c;color:#ffe1a1}
.rollb{min-height:61px;font-size:1.18em}
.tabs{gap:9px;padding:5px 13px 9px}.tabs button{border-radius:12px;border:1px solid #ba9d647a;background:#0d3032;color:#f0f5ec;font-size:13px;min-height:48px}
.tabs button[aria-pressed=true]{background:linear-gradient(155deg,#f8dea4,#cf9647);color:#18271e;border-color:#ffe6a7}
.panel{margin:0 10px 10px;border-radius:16px;background:#061d24de;border:1px solid #bd9a5a75;padding:9px;box-shadow:inset 0 1px 0 #fff1}
.orow{border-bottom:1px solid #c7ac721b;padding:3px 0 7px}.orow .ol{font-size:14px}.orow .ol small{color:#e5be7f}
.opt{border-radius:12px;border:1px solid #e6b76d94;background:#d8ad5230;color:#ffe0a3;min-height:50px}
.opt.best{box-shadow:0 0 0 2px #fada8d,0 0 16px #f9c25b5e}

<body>
<div id="app">
  <div class="conn" id="conn" hidden>Reconnecting…</div>

  <!-- join -->
  <section class="screen" id="scrJoin" hidden>
    <div class="center">
      <div class="join-kicker">Your seat at the table awaits</div>
      <img class="phone-logo" src="assets/gilded-five-brand.svg" width="750" height="270" alt="Gilded Five">
      <div class="tag">All that glitters rolls.</div>
      <form id="joinForm" class="center" style="padding:0;gap:12px" autocomplete="off">
        <div class="field"><label for="inCode">Room code (shown on the TV)</label>
          <input id="inCode" class="code" type="text" inputmode="text" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code"></div>
        <div class="field"><label for="inName">Your name</label>
          <input id="inName" type="text" maxlength="14" autocomplete="off" placeholder="Player" aria-label="Your name"></div>
        <div class="err" id="joinErr" role="alert"></div>
        <button class="btn" type="submit" id="btnJoin">Join the table</button>
      </form>
    </div>
  </section>

  <!-- waiting / lobby -->
  <section class="screen" id="scrWait" hidden>
    <div class="center" style="text-align:center">
      <img class="wait-logo" src="assets/gilded-five-brand.svg" width="750" height="270" alt="Gilded Five">
      <span class="chip bigchip" id="waitChip">?</span>
      <div class="title foil" style="font-size:clamp(28px,9vw,44px)" id="waitName"></div>
      <div class="muted" id="waitMsg">You're in. Waiting for the host to deal…</div>
      <div class="plist me" id="waitList"></div>
      <div id="captainBox" class="captain-box" hidden><b>TABLE CAPTAIN</b><p>Set the table here, then deal everyone in.</p><div class="captain-presets" id="capPresets"><button data-cap-preset="classic" type="button">Classic</button><button data-cap-preset="family" type="button">Family Night</button><button data-cap-preset="stakes" type="button">High Stakes</button></div><label class="cap-toggle"><input id="capSim" type="checkbox"> Everyone rolls together</label><label class="cap-toggle"><input id="capMirror" type="checkbox"> Mirror Roll</label><label class="cap-toggle">Timer <select id="capTimer"><option value="0">Off</option><option value="45">45 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option></select></label><div class="captain-presets" id="capBots"><button type="button" data-cap-bot="easy">+ Easy bot</button><button type="button" data-cap-bot="medium">+ Medium bot</button><button type="button" data-cap-bot="hard">+ Hard bot</button></div><button type="button" id="capPass" class="btn alt">Pass captain to next phone</button><button class="btn" id="captainDeal" type="button">Deal everyone in</button></div><button class="btn alt" type="button" id="btnLeave1">Leave</button>
    </div>
  </section>

  <!-- game -->
  <section class="screen" id="scrGame" hidden>
    <header class="gbar">
      <span class="chip" id="meChip">?</span>
      <div class="who"><div class="nm" id="meName"></div><div class="sub" id="meSub"></div></div>
      <button class="scores shakeb" id="btnShake" type="button" aria-pressed="false" aria-label="Shake to roll">Shake</button>
      <button class="scores" id="btnScores" type="button">Scores</button>
    </header>
    <div class="turnbar" id="turnbar"></div>
    <div class="house" id="house" hidden></div>
    <div id="playArea" class="screen" style="flex:1;min-height:0">
      <div class="tray" id="tray"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="actions">
        <button class="hintb" id="btnHint" type="button">Hint</button>
        <button class="btn rollb" id="btnRoll" type="button">Roll dice</button>
      </div>
      <div class="betbox" id="betBox" hidden></div>
      <div class="powers" id="powers" hidden></div>
      <button class="btn alt undo" id="btnUndo" type="button" hidden>Undo my last score</button>
      <button type="button" id="btnLock" class="btn lockb" hidden>LOCK IN YOUR HAND</button><div id="simSelected" class="sim-selected"></div>
      <div class="tabs" id="tabs">
        <button type="button" data-tab="score" aria-pressed="true">Score it</button>
        <button type="button" data-tab="card" aria-pressed="false">My card</button>
      </div>
      <div class="panel" id="panel"></div>
    </div>
    <div id="overArea" class="screen" hidden style="overflow:auto;padding:14px 14px 20px"></div>
  </section>

  <div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
</div>

<script src="/rules.js"></script>
<script>
(() => {
'use strict';
const R = window.Rules;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
// Reconnection tokens are bearer secrets. Generate new tokens with Web Crypto,
// not Math.random; existing stored tokens remain valid for current players.
const rnd = n => {
  const chars='abcdefghijklmnopqrstuvwxyz0123456789';let out='';
  if(crypto?.getRandomValues){
    while(out.length<n){
      const bytes=new Uint8Array(Math.max(16,n-out.length));crypto.getRandomValues(bytes);
      for(const v of bytes){if(v<252)out+=chars[v%chars.length];if(out.length===n)break;}
    }
  }else{for(let i=0;i<n;i++)out+=chars[Math.floor(Math.random()*chars.length)];}
  return out;
};
const initial = n => (String(n).trim()[0] || '?').toUpperCase();
const isMe = p => !!p && (p.sid === myId || !!(p.team && p.team.some(m => m.sid === myId)));
const rollerOf = p => p.team ? p.team[p.tm || 0].name : p.name;

let tok = LS.get('gf.tok', null); if (!tok) { tok = rnd(24); LS.set('gf.tok', tok); }
let myId = LS.get('gf.id', null);
const qs = new URLSearchParams(location.search);
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
let code = cleanCode(qs.get('c')) || cleanCode(LS.get('gf.code', ''));
let myName = LS.get('gf.name', '');
let privateTurn = null;
let ws = null, joined = false, hostOn = false, data = null, retry = 0, retryT = 0, pingT = 0, wantOn = false;
let tab = 'card', pendingKey = null, lockUntil = 0, shuffleT = 0, pmode = null, betAmt = 1;
let prev = { myTurn: false, roll: 0, rolling: false, cur: -1, phase: '', rule: null, betId: null };

/* ---------- screens ---------- */
function show(id) { ['scrJoin', 'scrWait', 'scrGame'].forEach(s => { $('#' + s).hidden = s !== id; }); }
function showJoin(err) {
  wantOn = false; joined = false; LS.set('gf.live', false);
  $('#inCode').value = code; $('#inName').value = myName; $('#joinErr').textContent = err || '';
  $('#conn').hidden = true; show('scrJoin');
}

/* ---------- connection ---------- */
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function connect() {
  wantOn = true; clearTimeout(retryT);
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  let sock;
  try { sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
  catch (e) { return scheduleRetry(); }
  ws = sock;
  sock.onopen = () => send({ t: 'join', code, tok, id: myId, name: myName });
  sock.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMsg(m); };
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null; clearInterval(pingT);
    if (wantOn) { $('#conn').hidden = !joined; scheduleRetry(); }
  };
  sock.onerror = () => {};
}
function scheduleRetry() { clearTimeout(retryT); retryT = setTimeout(connect, Math.min(6000, 700 * Math.pow(2, retry++))); }
function onMsg(m) {
  if (m.t === 'joined') {
    myId = m.id; myName = m.name; code = m.code; joined = true; retry = 0;
    LS.set('gf.id', myId); LS.set('gf.name', myName); LS.set('gf.code', code); LS.set('gf.live', true);
    $('#conn').hidden = true;
    clearInterval(pingT); pingT = setInterval(() => send({ t: 'ping' }), 20000);
    render();
  } else if (m.t === 'err') {
    wantOn = false;
    if (m.e === 'noroom') showJoin(`No room called ${code}. Check the code on the TV.`);
    else if (m.e === 'full') showJoin('That table is full.');
    else showJoin('Could not join. Try again.');
  } else if (m.t === 'kicked') { showJoin('You were removed from the table.'); try { ws && ws.close(); } catch (e) {} }
  else if (m.t === 'left') showJoin('The table was closed.');
  else if (m.t === 'host') { hostOn = !!m.on; render(); }
  else if (m.t === 'd') { data = m.d; if (!data?.S?.sim?.on)privateTurn=null; render(); }
  else if (m.t === 'priv') { privateTurn=m.d; render(); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wantOn && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});

$('#joinForm').addEventListener('submit', e => {
  e.preventDefault();
  code = cleanCode($('#inCode').value);
  myName = $('#inName').value.trim().slice(0, 14) || 'Player';
  if (code.length !== 4) { $('#joinErr').textContent = 'The code is 4 letters, shown on the TV.'; return; }
  $('#joinErr').textContent = ''; $('#btnJoin').textContent = 'Joining…';
  setTimeout(() => { $('#btnJoin').textContent = 'Join the table'; }, 2500);
  data = null; retry = 0; connect();
});
$('#inCode').addEventListener('input', e => { e.target.value = cleanCode(e.target.value); });
function leave() { send({ t: 'leave' }); LS.set('gf.live', false); data = null; showJoin(''); try { ws && ws.close(); } catch (e) {} }
$('#btnLeave1').onclick = leave;
$('#captainDeal').onclick = () => send({t:'a',a:{a:'captainDeal'}});
$('#capPresets').addEventListener('click',e=>{const b=e.target.closest('[data-cap-preset]');if(b)send({t:'a',a:{a:'captainSet',preset:b.dataset.capPreset}})});
$('#capBots').addEventListener('click',e=>{const b=e.target.closest('[data-cap-bot]');if(b)send({t:'a',a:{a:'captainBot',level:b.dataset.capBot}})});
$('#capSim').onchange=e=>send({t:'a',a:{a:'captainSet',simultaneous:e.target.checked}});
$('#capMirror').onchange=e=>send({t:'a',a:{a:'captainSet',mirror:e.target.checked}});
$('#capTimer').onchange=e=>send({t:'a',a:{a:'captainSet',timer:Number(e.target.value)}});
$('#capPass').onclick=()=>send({t:'a',a:{a:'captainPass'}});

/* ---------- rendering ---------- */
function render() {
  if (!joined) return;
  if (!data || data.k !== 'game') { renderWait(); return; }
  renderGame();
}
function renderWait() {
  show('scrWait');
  const mine = data && data.players ? data.players.find(p => p.id === myId) : null;
  $('#captainBox').hidden=!(data && data.captain===myId);
  if(data?.settings){const cfg=data.settings;$('#capSim').checked=!!cfg.simultaneous;$('#capMirror').checked=!!cfg.mirror;$('#capTimer').value=String(cfg.timer||0);$$('#capPresets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.capPreset===cfg.preset?'true':'false'));}
  $('#waitChip').className = 'chip bigchip c' + (mine ? mine.color : 0);
  $('#waitChip').textContent = initial(myName);
  $('#waitName').textContent = myName;
  $('#waitMsg').textContent = !hostOn ? 'The TV is reconnecting. Hang on…' : mine ? "You're in. Waiting for the host to deal…" : 'Connected. Waiting for the host…';
  const pill = p => `<span class="pill"><span class="chip c${p.color}">${esc(initial(p.name))}</span>${esc(p.name)}${p.bot ? ' (computer)' : ''}</span>`;
  const list = data && data.players ? data.players : [];
  if (data && data.teams && list.length > 1) {
    let h = '';
    for (let i = 0; i < list.length; i += 2) h += `<div class="tpair"><span class="tl">Team ${i / 2 + 1}</span>${list.slice(i, i + 2).map(pill).join('')}</div>`;
    $('#waitList').innerHTML = h;
  } else $('#waitList').innerHTML = list.map(pill).join('');
}

function msgFor(S, U, me, myTurn, cur, lim, lucky) {
  if (S.phase !== 'play') return ['Game over', false];
  if (me < 0) return [`Watching: ${cur.name} is ${S.rollNum === 0 ? 'about to roll' : 'playing'}…`, false];
  if (U.replay) return ['Watch the TV: instant replay!', true];
  if (!myTurn && me === S.current) return [`${rollerOf(cur)} is rolling for your team. Shout your advice!`, false];
  if (!myTurn) return [`${rollerOf(cur)}${cur.team ? ` (${cur.name})` : ''} is ${S.rollNum === 0 ? 'about to roll' : 'playing'}…`, false];
  if (U.suggest) return [U.suggest.text, true];
  if (U.rolling) return ['', false];
  if (S.rollNum === 0) return [shakeLive() ? 'Shake your phone or tap Roll' : 'Tap Roll to throw the dice', false];
  const p = S.players[me];
  if (R.isFive(S.dice) && p.cards.some(c => c.s.yahtzee != null)) {
    let t = '', alert = true;
    if (R.playerOptions(p, S.dice).some(o => o.bonus)) t = '+100 bonus if you score this! ';
    if (p.cards.length === 1) {
      const f = R.turnOptions(p.cards[0].s, S.dice), up = R.UPPER[S.dice[0] - 1];
      t += f.allowed.size === 1 && f.allowed.has(up.id) ? `Joker rule: you must score this in ${up.label}`
        : f.joker ? 'Joker! Any bottom box scores full points' : 'Joker rule: scratch an open top box';
    } else t += 'Pick where to score it';
    return [t, alert];
  }
  if (U.best) return [(S.rollNum < lim || lucky ? 'Tap dice to hold, or ' : '') + 'score the glowing box, your best pick', false];
  return [S.rollNum < lim ? 'Tap dice to hold them, then roll again, or pick a score' : lucky ? 'Use a lucky roll, or pick a score' : 'No rolls left. Pick a score', false];
}

let dieEls = [];
function buildDice() {
  const tray = $('#tray'); tray.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const b = document.createElement('button'); b.type = 'button'; b.className = i === 4 ? 'die gold-die' : 'die'; b.dataset.i = i;
    tray.appendChild(b);
  }
  dieEls = $$('.die', tray);
  tray.addEventListener('click', e => {
    const b = e.target.closest('.die'); if (!b || b.disabled) return;
    vibrate(8);
    if (pmode && pmode.i == null && (pmode.k === 'reroll' || pmode.k === 'nudge')) {
      if (pmode.k === 'reroll') { send({ t: 'a', a: { a: 'power', k: 'reroll', i: +b.dataset.i } }); pmode = null; }
      else pmode.i = +b.dataset.i;
      render(); return;
    }
    send({ t: 'a', a: { a: 'hold', i: +b.dataset.i } });
  });
}
const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
function setFace(el, v) {
  if (el._v === v) return; el._v = v;
  el.classList.remove('f1', 'f2', 'f3', 'f4', 'f5', 'f6'); el.classList.add('f' + v);
  el.innerHTML = PIPS[v].map(n => `<i class="pip" style="grid-area:${Math.ceil(n / 3)}/${(n - 1) % 3 + 1}"></i>`).join('');
}

function renderGame() {
  show('scrGame');
  const original = data.S, U = data.ui || {};
  R.setHouse(original.rule);R.setGoldDie(original.gold !== false);R.setUpperTarget(original.short ? 30 : 63);R.setShortGame(original.short);
  const me = original.players.findIndex(isMe);
  const liveSim=!!original.sim?.on;
  const turn=liveSim && privateTurn?.round===original.round && privateTurn?.seat===me ? privateTurn : null;
  const S=liveSim ? {...original,current:Math.max(0,me),rollNum:turn?.rollNum||0,dice:turn?.dice||[1,1,1,1,1],held:turn?.held||[false,false,false,false,false],extra:0,bet:null} : original;
  const play = S.phase === 'play';
  const cur = S.players[S.current];
  const ourTurn = play && me >= 0 && S.current === me;
  const myGo = ourTurn && cur.sid === myId && (!liveSim || (S.sim.stage==='rolling' && !!turn && !turn.locked));
  const myTurn = myGo && !U.replay && (!liveSim || !turn.chosenBox);
  const partnerTurn = ourTurn && cur.sid !== myId;
  const mine = me >= 0 ? S.players[me] : null;
  const myMember = mine && mine.team ? mine.team.find(m => m.sid === myId) : null;
  const lim = R.rollLimit(S), tokens = mine ? mine.tokens || 0 : 0;
  const lucky = myTurn && S.rollNum > 0 && S.rollNum >= lim && tokens > 0;

  /* header */
  const hc = $('#meChip'); hc.className = 'chip c' + (myMember ? myMember.color : mine ? mine.color : 2); hc.textContent = initial(myMember ? myMember.name : mine ? mine.name : myName);
  $('#meName').textContent = mine ? mine.name : myName + ' (watching)';
  const T = S.players.map(p => R.totals(p));
  $('#meSub').textContent = (play ? `${liveSim?'Round':'Turn'} ${S.round} of ${(S.short?7:13) * S.ncols}` : 'Final scores') + (mine ? ` · ${T[me].grand} pts` : '') +
    (play && tokens ? ` · Lucky  ${tokens} lucky roll${tokens === 1 ? '' : 's'}` : '') + (S.chipsOn && mine ? ` · Chips  ${mine.chips || 0}` : '');

  /* house rule strip */
  const hs = $('#house');
  hs.hidden = !(play && U.house);
  if (play && U.house) {
    hs.innerHTML = `<b>${esc(U.house.name)}</b>${esc(U.house.text)}`;
    if (prev.rule !== S.rule) { hs.classList.remove('new'); void hs.offsetWidth; hs.classList.add('new'); if (prev.rule !== null || S.round > 1) vibrate([30, 40, 30]); }
  }

  /* transitions */
  const nowKey = { myTurn: myGo, roll: S.rollNum, rolling: !!U.rolling, cur: S.current, phase: S.phase, rule: S.rule || null, betId: S.bet ? S.bet.id : null };
  if (!myGo || U.rolling || prev.roll !== S.rollNum || prev.cur !== S.current) pmode = null;
  if (S.bet && prev.betId !== S.bet.id) betAmt = 1;
  if (S.bet && S.bet.open && me >= 0 && me !== S.current && prev.betId !== S.bet.id) vibrate([20, 40, 20]);
  if (myGo && !prev.myTurn) { tab = 'card'; vibrate([160, 70, 160]); pendingKey = null; }
  if (!myGo && prev.myTurn) { tab = 'card'; pendingKey = null; }
  if (myGo && S.rollNum > 0 && !U.rolling && (prev.rolling || prev.roll !== S.rollNum || prev.cur !== S.current)) { tab = 'score'; pendingKey = null; if (R.isFive(S.dice)) vibrate([40, 60, 40, 60, 90]); else vibrate(14); }
  prev = nowKey;

  /* game over */
  $('#playArea').hidden = !play ? true : false;
  $('#overArea').hidden = play;
  $('#turnbar').hidden = !play;
  if (!play) { renderOver(S, U, me, T); return; }

  /* turn bar */
  const tb = $('#turnbar');
  tb.className = 'turnbar' + (myTurn ? ' mine' : partnerTurn ? ' team' : '');
  tb.textContent = liveSim ? (S.sim.stage==='reveal'?'THE BIG REVEAL':S.sim.stage==='settled'?'ROUND COMPLETE':turn?.locked?'LOCKED IN — WAIT FOR EVERYONE':turn?.chosenBox?'CHOOSE LOCK IN OR CHANGE':'YOUR PRIVATE DICE') : U.replay ? 'Instant replay on the TV' : myTurn ? (cur.team ? 'YOUR TURN FOR THE TEAM' : 'YOUR TURN') : partnerTurn ? `${rollerOf(cur)} rolls for your team` : `${cur.name}'s turn`;

  /* dice */
  const idle = S.rollNum === 0 && !U.rolling;
  const sg = U.suggest && U.suggest.keep;
  const picking = !!(pmode && pmode.i == null && true);
  const canTap = myTurn && !U.rolling && S.rollNum > 0 && (S.rollNum < lim || lucky || picking);
  clearInterval(shuffleT);
  dieEls.forEach((el, i) => {
    setFace(el, S.dice[i]);
    el.classList.toggle('idle', idle);
    el.classList.toggle('held', !!S.held[i] && !idle);
    el.classList.toggle('rolling', !!U.rolling && !S.held[i]);
    el.classList.toggle('suggest', !!(sg && myTurn && sg[i] && !S.held[i]));
    el.classList.toggle('drop', !!(sg && myTurn && !sg[i] && S.held[i]));
    el.disabled = !canTap;
    el.classList.toggle('pick', picking && myTurn);
    el.setAttribute('aria-label', `Die ${i + 1} showing ${S.dice[i]}${S.held[i] ? ', held' : ''}`);
  });
  if (U.rolling) shuffleT = setInterval(() => dieEls.forEach((el, i) => { if (!S.held[i]) setFace(el, 1 + Math.floor(Math.random() * 6)); }), 90);

  /* message + buttons */
  const [txt, alert] = msgFor(S, U, me, myTurn, cur, lim, lucky);
  const m = $('#msg'); m.textContent = txt; m.classList.toggle('alert', alert);
  const rb = $('#btnRoll');
  rb.disabled = !(myTurn && !U.rolling && (S.rollNum < lim || lucky));
  rb.classList.toggle('lucky', lucky && !U.rolling);
  rb.textContent = U.replay ? 'Instant replay…' : !myTurn ? (me < 0 ? 'Watching' : `${rollerOf(cur)} is playing`) : U.rolling ? 'Rolling…' : S.rollNum === 0 ? 'Roll dice' :
    S.rollNum < lim ? `Roll again (${lim - S.rollNum} left)` : lucky ? `Lucky  Lucky roll (${tokens} left)` : 'Pick a score';
  $('#btnHint').disabled = !(myTurn && !U.rolling && S.rollNum > 0) || liveSim;
  $('#btnHint').hidden = me < 0 || liveSim;
  $('#btnUndo').hidden = liveSim || !(me >= 0 && U.undoBy === me && !myTurn);
  $('#tabs').hidden = me < 0;
  if(liveSim){$('#betBox').hidden=!(S.chipsOn && S.sim.stage==='rolling' && turn && turn.rollNum===0 && !turn.bet && (mine.chips||0)>0);
    if(!$('#betBox').hidden)$('#betBox').innerHTML='<b>Back yourself for Hand of the Round</b><button class="btn alt" type="button" id="simBet" data-simbet="1">Bet 1 chip · pays 3:1</button>';
    $('#powers').hidden=true;}else{renderBet(S, me, myTurn, mine);renderPowers(S, U, myTurn, mine);}
  $('.actions').hidden = liveSim ? !myTurn : (!myTurn && !$('#betBox').hidden);
  $('#btnShake').hidden = me < 0 || !window.isSecureContext || !('DeviceMotionEvent' in window);
  if (picking) m.textContent = pmode.k === 'reroll' ? 'Tap the die you want to re-roll' : 'Tap the die you want to nudge';

  /* panel */
  $$('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab ? 'true' : 'false'));
  $('#btnLock').hidden=!(liveSim && S.sim.stage==='rolling' && turn?.chosenBox && !turn.locked);
  if(liveSim && turn?.chosenBox && !turn.locked) { const o=R.playerOptions(S.players[me],turn.dice).find(x=>x.key===turn.chosenBox);
    $('#simSelected').textContent=o?`Selected: ${R.CAT[o.cat].label} · ${o.val*o.mult} points. Lock to commit or select another box.`:''; }
  else $('#simSelected').textContent=liveSim && turn?.locked?'Locked in. Awaiting the rest of the table.':'';
  if(me<0)renderStandings($('#panel'),S,T);
  else if(liveSim && S.sim.stage!=='rolling'){$('#panel').innerHTML='<div class="empty">The TV is revealing the hands. Scores update when the round ends.</div>';}
  else if(liveSim && turn?.locked){$('#panel').innerHTML='<div class="empty">Your hand is locked. Everyone will see the reveal together.</div>';}
  else if(tab==='score')renderOptions(S,U,me,myTurn || !!(liveSim && turn?.chosenBox));
  else renderCard(S,me,T);
}

function renderBet(S, me, myTurn, mine) {
  const box = $('#betBox'), b = S.bet;
  if (!S.chipsOn || !b || me < 0 || me === S.current || S.phase !== 'play') { box.hidden = true; return; }
  box.hidden = false;
  const st = b.stakes[me], chips = mine.chips || 0;
  let h = `<div class="bk">Side bet · Chips  ${chips} chips · <span class="pots">Jackpot ${S.pot}</span></div><div class="bq">${esc(b.q)}</div>`;
  if (st) h += `<div class="placed">You bet ${st.amt} on ${st.side === 'y' ? 'Yes' : 'No'}. Pays ${st.amt * (st.side === 'y' ? b.yes : b.no)} if right.</div>`;
  else if (!b.open) h += `<div class="note">Bets are closed for this turn.</div>`;
  else if (chips < 1) h += `<div class="note">You're out of chips. Win the jackpot with a Gilded Five!</div>`;
  else {
    if (betAmt > chips) betAmt = chips;
    h += '<div class="row">' + [1, 2, 3].map(n => `<button type="button" class="amt" data-amt="${n}" aria-pressed="${betAmt === n}"${n > chips ? ' disabled' : ''}>${n}</button>`).join('') + '</div>' +
      `<div class="row"><button type="button" class="side" data-side="y">Yes<small>wins ${betAmt * b.yes}</small></button>` +
      (b.no ? `<button type="button" class="side no" data-side="n">No<small>wins ${betAmt * b.no}</small></button>` : '') + '</div>';
  }
  box.innerHTML = h;
}
function renderPowers(S, U, myTurn, mine) {
  const box = $('#powers'), P = U.powers;
  const show = !!(S.chipsOn && P && myTurn && S.rollNum > 0 && !U.rolling);
  box.hidden = !show; if (!show) return;
  const chips = mine.chips || 0;
  let h = '';
  if (!pmode) {
    h = Object.entries(P).map(([k, pw]) => {
      const noTarget = false;
      return `<button type="button" class="pw" data-pw="${k}"${chips >= pw.cost && !noTarget ? '' : ' disabled'}>${esc(pw.short)}<small>${pw.cost} chips</small></button>`;
    }).join('');
  } else if (pmode.k === 'nudge' && pmode.i != null) {
    const v = S.dice[pmode.i];
    h = `<div class="ask">Die ${pmode.i + 1} shows ${v}</div>` +
      `<button type="button" class="pw" data-dir="-1"${v > 1 ? '' : ' disabled'}>▼ ${v > 1 ? v - 1 : ''}</button>` +
      `<button type="button" class="pw" data-dir="1"${v < 6 ? '' : ' disabled'}>▲ ${v < 6 ? v + 1 : ''}</button>` +
      '<button type="button" class="pw x" data-pwx="1">Cancel</button>';

function renderOptions(S, U, me, myTurn) {
  const p = $('#panel');
  if (!myTurn || S.rollNum === 0 || U.rolling) {
    p.innerHTML = `<div class="empty">${myTurn ? (U.rolling ? 'Rolling…' : 'Roll the dice, then your scoring options appear here.') : 'Your options appear here on your turn.'}</div>`;
    return;
  }
  const P = S.players[me], opts = R.playerOptions(P, S.dice), multi = P.cards.length > 1;
  const byCat = new Map();
  opts.forEach(o => { if (!byCat.has(o.cat)) byCat.set(o.cat, []); byCat.get(o.cat).push(o); });
  const rows = [...byCat.entries()].map(([cat, list]) => ({ cat, list, best: Math.max(...list.map(o => o.val * o.mult)) }));
  const good = rows.filter(r => r.best > 0).sort((a, b) => b.best - a.best);
  const zero = rows.filter(r => r.best <= 0).sort((a, b) => R.CATS.findIndex(c => c.id === a.cat) - R.CATS.findIndex(c => c.id === b.cat));
  const btn = o => {
    const z = o.val === 0, conf = pendingKey === o.key, pts = o.val * o.mult;
    return `<button type="button" class="opt${z ? ' zero' : ''}${conf ? ' confirm' : ''}${U.cursor === o.key ? ' best' : ''}${U.best === o.key ? ' glow' : ''}" data-key="${o.key}" data-zero="${z ? 1 : 0}">` +
      (conf ? 'Scratch?' : multi ? `<small>×${o.mult}</small>${pts}` : pts) + (o.bonus ? '<span class="bn">+100</span>' : '') + '</button>';
  };
  const row = r => `<div class="orow${multi ? '' : ' single'}"><div class="ol">${esc(R.CAT[r.cat].label)}<small>${R.ptsLabel(r.cat) ? 'worth ' + R.ptsLabel(r.cat) : 'dice added up'}</small></div>${r.list.map(btn).join('')}</div>`;
  let h = '';
  if (good.length) h += good.map(row).join('');
  else h += '<div class="empty">Nothing scores here. You must scratch a box.</div>';
  if (zero.length) h += `<div class="sect">SCRATCH A BOX (0 POINTS)</div>` + zero.map(row).join('');

}

function renderCard(S, me, T) {
  const P = S.players[me], t = T[me], multi = P.cards.length > 1;
  const cell = (card, id) => { const v = card.s[id]; const shortClosed=S.short&&R.CATS.filter(c=>card.s[c.id]!=null).length>=7; return v == null ? (shortClosed?'<td class="open" aria-label="Not used in Short game">–</td>':'<td class="open">·</td>') : `<td class="v">${v}</td>`; };
  let h = '<table class="card"><thead><tr><th></th>' + P.cards.map((c, i) => `<th>${multi ? '×' + (i + 1) : P.name}</th>`).join('') + '</tr></thead><tbody>';
  const cats = list => list.map(c => `<tr><th scope="row">${esc(c.label)}</th>${P.cards.map(card => cell(card, c.id)).join('')}</tr>`).join('');
  h += cats(R.UPPER);
  h += `<tr class="sub"><th scope="row">Top total (${S.short?30:63} for +35)</th>${t.cols.map(c => `<td>${c.up}</td>`).join('')}</tr>`;
  h += `<tr class="sub"><th scope="row">Bonus</th>${t.cols.map(c => `<td>${c.bonus ? '+35' : '·'}</td>`).join('')}</tr>`;
  h += cats(R.LOWER);
  h += `<tr class="sub"><th scope="row">Gilded bonus</th>${t.cols.map(c => `<td>${c.yb ? '+' + c.yb : '·'}</td>`).join('')}</tr>`;
  if (multi) h += `<tr class="sub"><th scope="row">After multiplier</th>${t.cols.map(c => `<td>${c.scored}</td>`).join('')}</tr>`;
  if (t.xp) h += `<tr class="sub xp"><th scope="row">Extras (head start, house)</th><td colspan="${P.cards.length}">+${t.xp}</td></tr>`;
  h += `<tr class="tot"><th scope="row">Total</th><td colspan="${P.cards.length}">${t.grand}</td></tr></tbody></table>`;
  $('#panel').innerHTML = h;
}

function standingsHtml(S, T) {
  const rows = S.players.map((p, i) => ({ p, i, g: T[i].grand })).sort((a, b) => b.g - a.g);
  rows.forEach((r, k) => { r.rank = k > 0 && r.g === rows[k - 1].g ? rows[k - 1].rank : k + 1; });
  return rows.map(r => `<div class="rank${r.rank === 1 ? ' first' : ''}${S.phase === 'play' && r.i === S.current ? ' act' : ''}"><span class="pos">${r.rank}</span>` +
    `<span class="chip c${r.p.color}">${esc(initial(r.p.name))}</span><span class="nm">${esc(r.p.name)}${isMe(r.p) ? ' (you)' : ''}</span><span class="tt">${r.g}</span></div>`).join('');
}

/* ---------- shake to roll (needs https: phones block motion sensors on plain http) ---------- */
let shakeOn = LS.get('gf.shake', false), motionOn = false, shakeHits = 0, lastJolt = 0;
const shakeLive = () => shakeOn && motionOn;
function note(text) {
  $('#sheetBox').innerHTML = `<h2>Shake to roll</h2><p style="text-align:center;line-height:1.4">${esc(text)}</p><button class="btn alt" type="button" id="btnMotionOK">OK</button>`;
  $('#sheet').hidden = false; $('#btnMotionOK').onclick = () => { $('#sheet').hidden = true; };
}
async function startMotion(fromTap) {
  if (motionOn) return true;
  if (!window.isSecureContext || !('DeviceMotionEvent' in window)) {
    if (fromTap) note("Your phone only lets games read the motion sensor on a secure (https) address. Shake works on the online version of Gilded Five. Over home Wi-Fi, tap Roll instead.");
    return false;
  }
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { if (fromTap) note('Motion access was not allowed. You can still tap Roll.'); return false; }
    }
  } catch (e) { if (fromTap) note('Tap the Shake button again to allow motion access.'); return false; }
  addEventListener('devicemotion', onMotion); motionOn = true; return true;
}
function stopMotion() { removeEventListener('devicemotion', onMotion); motionOn = false; }
function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration; if (!a) return;
  const g = Math.hypot(a.x || 0, a.y || 0, a.z || 0), now = Date.now();
  if (Math.abs(g - 9.81) > 13) { if (now - lastJolt > 60) shakeHits++; lastJolt = now; if (shakeHits === 3) vibrate(15); }
  else if (shakeHits >= 4 && now - lastJolt > 230) { shakeHits = 0; shakeRoll(); }
  if (now - lastJolt > 900) shakeHits = 0;
}
function shakeRoll() {
  const rb = $('#btnRoll');
  if (!shakeOn || rb.disabled || $('#scrGame').hidden || !$('#sheet').hidden) return;
  rb.click();
}
function syncShakeBtn() { const b = $('#btnShake'); b.setAttribute('aria-pressed', shakeLive() ? 'true' : 'false'); b.textContent = shakeLive() ? 'On' : 'Shake'; }
$('#btnShake').addEventListener('click', async () => {
  if (shakeLive()) { shakeOn = false; LS.set('gf.shake', false); stopMotion(); syncShakeBtn(); render(); return; }
  if (await startMotion(true)) { shakeOn = true; LS.set('gf.shake', true); vibrate([20, 40, 20]); }
  syncShakeBtn(); render();
});
/* iPhones ask again after a reload, and that needs a tap */
addEventListener('pointerdown', () => { if (shakeOn && !motionOn) startMotion(false).then(syncShakeBtn); }, { once: true });
syncShakeBtn();

/* wake lock (only works on https or localhost; harmless otherwise) */
async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joined) wake(); });
addEventListener('pointerdown', wake, { once: true });
